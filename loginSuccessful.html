<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<link rel="icon" href="https://i.imgur.com/whpgDjK.jpeg" sizes="32x32" />
		<title>MINISIS OPAC Template</title>
	</head>
	<body>
		<script>
			function getCookie(name) {
				return (
					document.cookie
						.split('; ')
						.find((row) => row.startsWith(name + '='))
						?.split('=')[1] || ''
				)
			}

			document.addEventListener('DOMContentLoaded', () => {
				const sessionId = getCookie('HOME_SESSID')
				if (sessionId) {
					const url = `${sessionId}?SEARCH&DATABASE=CLIENT&REPORT=WEB_PATRON_PROFILE&EXP=patron_id+~3D+global(m2l_patron_id)`
					window.location.href = url
				} else {
					console.error('HOME_SESSID cookie not found.')
				}
			})
		</script>
	</body>
</html>
