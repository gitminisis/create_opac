name: Format and Lint

on:
    pull_request:
        branches: ['*']

jobs:
    format-and-lint:
        runs-on: ubuntu-latest
        name: npm lint and format

        steps:
            - name: Checkout Repository
              uses: actions/checkout@v3

            - uses: pnpm/action-setup@v2.2.4
              name: Install pnpm
              id: pnpm-install
              with:
                  version: 8.6.1
                  run_install: false

            - name: Install Dependencies
              run: pnpm install

            - name: Format Code
              run: pnpm run format

            - name: Lint Code
              run: pnpm run lint
